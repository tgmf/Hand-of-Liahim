// ===== MODAL =====

// Desktop: scroll the wheel over the card image to zoom it; the pointer position
// sets the focal point, and leaving the image resets it.
const modalZoom = { scale: 1 };

// When the modal is opened from a spread, these hold the cards a horizontal
// swipe can cycle through and the position currently shown (null = no cycling).
let modalCards = null;
let modalIndex = -1;
// What the modal is currently showing, so a deck/language change can re-render
// it live (see refreshOpenModal).
let modalCard = null;
let modalOpts = null;
(function initModalZoom() {
  const box = document.getElementById('modal-visual');
  const img = document.getElementById('modal-img');
  const MIN = 1, MAX = 5;
  const active = () => matchMedia('(min-width: 769px)').matches;

  function render(px, py) {
    if (px != null) {
      const r = box.getBoundingClientRect();
      img.style.transformOrigin =
        `${((px - r.left) / r.width) * 100}% ${((py - r.top) / r.height) * 100}%`;
    }
    img.style.transform = modalZoom.scale > 1 ? `scale(${modalZoom.scale})` : '';
    box.classList.toggle('zoomed', modalZoom.scale > 1);
  }

  box.addEventListener('wheel', e => {
    if (!active()) return;
    e.preventDefault();
    const next = Math.min(MAX, Math.max(MIN,
      modalZoom.scale * (e.deltaY < 0 ? 1.2 : 1 / 1.2)));
    if (next !== modalZoom.scale) { modalZoom.scale = next; render(e.clientX, e.clientY); }
  }, { passive: false });

  box.addEventListener('mousemove', e => {
    if (modalZoom.scale > 1) render(e.clientX, e.clientY);
  });

  box.addEventListener('mouseleave', () => {
    if (modalZoom.scale > 1) { modalZoom.scale = 1; render(); }
  });
})();

function resetModalZoom() {
  modalZoom.scale = 1;
  const img = document.getElementById('modal-img');
  img.style.transform = '';
  img.style.transformOrigin = 'center';
  document.getElementById('modal-visual').classList.remove('zoomed');
}

// Render one card's art + text into a .modal-swipe slide — the live #modal-swipe
// or an id-stripped pager clone. Class selectors so both work; also resets the
// slide's scroll so a freshly shown card starts at the top.
function renderCardInto(root, card, opts = {}, idx = -1) {
  // "I · Past" above the name when the card belongs to a drawn spread.
  const spread = state.currentSpread;
  const pos = idx >= 0 && spread && spread.positions[idx]
    ? `${toRoman(idx + 1)} · ${spread.positions[idx]}` : '';
  const posEl = root.querySelector('.modal-pos');
  posEl.textContent = pos;
  posEl.style.display = pos ? '' : 'none';

  root.querySelector('.modal-name').textContent = card.displayName;
  root.querySelector('.modal-arcana').textContent =
    card.arcana === 'Major'
      ? `${t('card.majorArcanaLabel')} · ${getCardNumber(card)}`
      : `${t('index.filter.' + String(card.suit).toLowerCase())} · ${t('card.minorArcanaLabel')}`;
  root.querySelector('.modal-upright').textContent = card.upright;
  root.querySelector('.modal-reversed').textContent = card.reversed;

  // Show both orientations only in the Card Index; in a spread show the drawn orientation
  const showUpright = opts.showBoth || !card.isReversed;
  const showReversed = opts.showBoth || card.isReversed;
  root.querySelector('.modal-upright-block').style.display = showUpright ? '' : 'none';
  root.querySelector('.modal-reversed-block').style.display = showReversed ? '' : 'none';
  // In a drawn spread, upright is the default/unlabeled state — only "Reversed"
  // gets called out. The Card Index still labels both, since it shows both.
  root.querySelector('.modal-upright-block h4').style.display = opts.showBoth ? '' : 'none';

  // Symbolic / archetypal meaning and qabalah — shown only when the card carries them.
  const symbolicBlock = root.querySelector('.modal-symbolic-block');
  if (card.symbolic) {
    root.querySelector('.modal-symbolic').textContent = card.symbolic;
    symbolicBlock.style.display = '';
  } else {
    symbolicBlock.style.display = 'none';
  }

  const qabalahBlock = root.querySelector('.modal-qabalah-block');
  if (card.qabalah) {
    const q = card.qabalah;
    const meta = [
      [q.letter, q.symbol].filter(Boolean).join(' '),
      q.sephiroth,
      q.pathNumber && `${t('modal.qabalah.path')} ${q.pathNumber}`,
    ].filter(Boolean).join('  ·  ');
    const metaEl = root.querySelector('.modal-qabalah-meta');
    metaEl.textContent = meta;
    metaEl.style.display = meta ? '' : 'none';
    root.querySelector('.modal-qabalah').textContent = q.interpretation || '';
    qabalahBlock.style.display = '';
  } else {
    qabalahBlock.style.display = 'none';
  }

  root.querySelector('.modal-keywords').innerHTML = card.keywords.map(k =>
    `<span class="keyword">${k}</span>`
  ).join('  ·  ');

  const fullUrl = getCardFullUrl(card);
  const modalImg = root.querySelector('.modal-img');
  const modalPh = root.querySelector('.modal-img-ph');
  const shimmer = root.querySelector('.modal-img-loading');

  modalImg.style.display = 'none';
  modalPh.style.display = 'none';
  shimmer.style.display = 'none';

  if (fullUrl) {
    shimmer.style.display = 'block';
    const loader = new Image();
    const show = () => {
      shimmer.style.display = 'none';
      modalImg.src = fullUrl;
      modalImg.alt = card.displayName;
      modalImg.style.display = 'block';
    };
    loader.onload = show;
    loader.onerror = () => {
      shimmer.style.display = 'none';
      modalPh.style.display = 'block';
      modalPh.textContent = card.symbol || '✦';
    };
    loader.src = fullUrl;
    if (loader.complete) show();   // already cached — skip the shimmer flash
  } else {
    modalPh.style.display = 'block';
    modalPh.textContent = card.symbol || '✦';
  }

  root.scrollTop = 0;
  const sc = root.querySelector('.deck-scroll') || root.querySelector('.modal-detail');
  if (sc) sc.scrollTop = 0;
}

function fillModalCard(card, opts = {}) {
  resetModalZoom();
  renderCardInto(document.getElementById('modal-swipe'), card, opts, modalIndex);
}

function openModal(card, opts = {}) {
  // The card deck only runs for a spread with more than one card, on mobile.
  modalCards = (opts.list && opts.list.length > 1) ? opts.list : null;
  modalIndex = modalCards ? opts.index : -1;
  modalCard = card;
  modalOpts = opts;

  document.getElementById('card-modal').classList.add('open');
  updateScrollLock();
  history.pushState({ overlay: 'card' }, '');

  if (pagerActive()) buildDeck();
  else { teardownDeck(); fillModalCard(card, opts); }

  if (opts.focusMeaning) {
    const active = currentSlide();
    if (active) {
      const toMeaning = () => {
        const m = active.querySelector('.modal-meaning');
        if (m) m.scrollIntoView({ block: 'start' });
      };
      requestAnimationFrame(toMeaning);
      const img = active.querySelector('.modal-img');
      if (img) img.addEventListener('load', toMeaning, { once: true });
    }
  }
}

// ===== CARD DECK (mobile) =====
// Only THREE slides are mounted (a bigger stack gets occlusion-culled by the
// WebView and blanks out). deckRole maps {c,l,r} -> which of the 3 nodes is the
// centre / left-neighbour / right-neighbour card. On a swipe only the centre
// slide moves (thumb + tilt) and the revealed neighbour scales up. On commit
// the roles rotate and the ONE slide that's now stale — always hidden behind
// the opaque centre card — is re-rendered. Nothing visible is ever re-rendered.
// Vertical content-scroll is JS-driven (slides are touch-action:none) so the
// browser never scroll-commits and repaints the card mid-grab.
const DECK_TILT = 12, DECK_COMMIT_PX = 130;
let deckK = 0, deckOffset = 0, deckAnim = 0, deckDone = null;
let deckRole = { c: 1, l: 0, r: 2 };

function pagerActive() {
  return !!modalCards && !matchMedia('(min-width: 769px)').matches;
}

function currentSlide() {
  const kids = document.getElementById('modal-rail').children;
  return kids[deckRole.c] || document.getElementById('modal-swipe');
}

// Per-frame: move the centre slide, scale up the neighbour in the drag direction.
function deckApply() {
  const rail = document.getElementById('modal-rail');
  const s = rail.children;
  if (s.length < 3) return;
  const w = rail.clientWidth || 1;
  const prog = Math.min(1, Math.abs(deckOffset) / DECK_COMMIT_PX);

  const front = s[deckRole.c];
  front.style.transform = `translate3d(${deckOffset}px,0,0) rotate3d(0,0,1,${(deckOffset / w) * DECK_TILT}deg)`;
  front.style.zIndex = '30';
  front.style.pointerEvents = 'auto';

  const peer = deckOffset <= 0 ? s[deckRole.r] : s[deckRole.l];
  const other = deckOffset <= 0 ? s[deckRole.l] : s[deckRole.r];
  peer.style.transform = `translate3d(0,0,0) scale(${0.92 + 0.08 * prog})`;
  peer.style.zIndex = '20';
  peer.style.pointerEvents = 'none';
  other.style.transform = 'translate3d(0,0,0) scale(0.92)';
  other.style.zIndex = '10';
  other.style.pointerEvents = 'none';
}

// Spring-back / settle tween (offset -> `to`). Not force-completable.
function deckTween(to, dur, done) {
  cancelAnimationFrame(deckAnim);
  const from = deckOffset;
  const t0 = performance.now();
  const ease = x => 1 - Math.pow(1 - x, 3);
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    deckOffset = from + (to - from) * ease(p);
    deckApply();
    if (p < 1) deckAnim = requestAnimationFrame(step);
    else { deckOffset = to; deckApply(); if (done) done(); }
  };
  deckAnim = requestAnimationFrame(step);
}

// Throw the centre card off in `dir`. Finalises the instant it clears the
// screen — no wasted travel/time — and can be force-finished by the next touch.
function deckThrow(dir) {
  cancelAnimationFrame(deckAnim);
  const w = document.getElementById('modal-rail').clientWidth || 1;
  const from = deckOffset;
  const target = (dir > 0 ? -1 : 1) * w * 1.15;
  const dur = Math.max(110, Math.min(240, Math.abs(target - from) * 0.42));
  const t0 = performance.now();
  const ease = x => 1 - Math.pow(1 - x, 3);
  deckDone = () => { deckDone = null; cancelAnimationFrame(deckAnim); deckCommit(dir); };
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    deckOffset = from + (target - from) * ease(p);
    if (p >= 1 || Math.abs(deckOffset) >= w) { deckDone(); return; }
    deckApply();
    deckAnim = requestAnimationFrame(step);
  };
  deckAnim = requestAnimationFrame(step);
}

// If a throw is mid-flight, snap it to done (so a fast re-grab lands on the
// NEW card, not the one still leaving).
function deckFinishThrow() {
  if (deckDone) deckDone();
}

// dir +1 = advance to next card, -1 = previous. Roles rotate; the newly-stale
// far slide (hidden behind the centre) is re-rendered.
function deckCommit(dir) {
  const s = document.getElementById('modal-rail').children;
  const n = modalCards.length;
  deckK = (deckK + dir + n) % n;
  const r = deckRole;
  deckRole = dir > 0 ? { c: r.r, l: r.c, r: r.l } : { c: r.l, l: r.r, r: r.c };
  const staleNode = s[dir > 0 ? deckRole.r : deckRole.l];
  const staleIdx = dir > 0 ? (deckK + 1) % n : (deckK - 1 + n) % n;
  renderCardInto(staleNode, modalCards[staleIdx], {}, staleIdx);
  deckOffset = 0;
  deckApply();
  renderDeckDots();
}

// Progress dots under the card deck (mobile): the current card's pill is wide.
function renderDeckDots() {
  const dots = document.getElementById('modal-dots');
  const n = modalCards ? modalCards.length : 0;
  if (dots.children.length !== n) {
    dots.replaceChildren(...Array.from({ length: n }, () => document.createElement('i')));
  }
  Array.from(dots.children).forEach((d, i) => d.classList.toggle('on', i === deckK));
}

function buildDeck() {
  cancelAnimationFrame(deckAnim);
  const track = document.querySelector('.modal-track');
  const rail = document.getElementById('modal-rail');
  const template = document.getElementById('modal-swipe');
  const n = modalCards.length;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 3; i++) {
    const s = template.cloneNode(true);
    s.removeAttribute('id');
    s.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
    s.classList.add('deck-slide');
    s.style.cssText = '';
    const sc = document.createElement('div');   // inner native-scroll layer
    sc.className = 'deck-scroll';
    while (s.firstChild) sc.appendChild(s.firstChild);
    s.appendChild(sc);
    frag.appendChild(s);
  }
  rail.replaceChildren(frag);
  track.classList.add('paged');
  deckK = modalIndex;
  deckRole = { c: 1, l: 0, r: 2 };
  const s = rail.children;
  renderCardInto(s[deckRole.c], modalCards[deckK], {}, deckK);
  renderCardInto(s[deckRole.l], modalCards[(deckK - 1 + n) % n], {}, (deckK - 1 + n) % n);
  renderCardInto(s[deckRole.r], modalCards[(deckK + 1) % n], {}, (deckK + 1) % n);
  deckOffset = 0;
  deckApply();
  renderDeckDots();
}

function teardownDeck() {
  cancelAnimationFrame(deckAnim);
  const track = document.querySelector('.modal-track');
  const rail = document.getElementById('modal-rail');
  if (track) track.classList.remove('paged');
  if (rail) rail.replaceChildren();
  deckK = 0; deckOffset = 0; deckRole = { c: 1, l: 0, r: 2 };
}

(function initDeck() {
  const overlay = document.getElementById('card-modal');
  const rail = document.getElementById('modal-rail');
  const EDGE = 24;
  let sx = 0, sy = 0, axis = null, tracking = false, startOffset = 0, w = 1;
  let vX = 0, vT = 0, pX = 0;

  overlay.addEventListener('touchstart', e => {
    if (!pagerActive() || e.touches.length !== 1 || !rail.children.length) { tracking = false; return; }
    const t = e.touches[0];
    if (t.clientX < EDGE || t.clientX > window.innerWidth - EDGE) { tracking = false; return; }
    cancelAnimationFrame(deckAnim);
    deckFinishThrow();               // a card mid-throw is done — grab the new one
    sx = t.clientX; sy = t.clientY; axis = null; tracking = true;
    w = rail.clientWidth || 1;
    startOffset = deckOffset;
    pX = t.clientX; vX = 0; vT = performance.now();
  }, { passive: true });

  // All passive. Horizontal = our swipe; vertical is left entirely to the
  // browser's native scroll of the inner .deck-scroll (real momentum, no
  // preventDefault, no intervention).
  overlay.addEventListener('touchmove', e => {
    if (!tracking) return;
    const t = e.touches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (axis === null && Math.hypot(dx, dy) > 10) axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (axis !== 'x') return;
    const now = performance.now(), dt = now - vT;
    if (dt > 0) { vX = (t.clientX - pX) / dt; pX = t.clientX; vT = now; }
    let o = startOffset + dx;
    if (Math.abs(o) > w) o = Math.sign(o) * (w + (Math.abs(o) - w) * 0.3);
    deckOffset = o;
    deckApply();
  }, { passive: true });

  overlay.addEventListener('touchend', e => {
    if (!tracking) return;
    tracking = false;
    if (axis !== 'x') return;
    const flick = Math.abs(vX) > 0.4;
    const far = Math.abs(deckOffset) > Math.min(w * 0.32, 130);
    if (modalCards.length > 1 && deckOffset !== 0 && (flick || far)) {
      deckThrow((flick ? vX < 0 : deckOffset < 0) ? 1 : -1);
    } else {
      deckTween(0, 200, () => { deckApply(); });
    }
  }, { passive: true });

  overlay.addEventListener('touchcancel', () => {
    if (!tracking) return;
    tracking = false;
    if (axis === 'x') deckTween(0, 180, () => { deckApply(); });
  }, { passive: true });
})();

function closeCardModal() {
  document.getElementById('card-modal').classList.remove('open');
  modalCards = null;
  modalIndex = -1;
  modalCard = null;
  modalOpts = null;
  teardownDeck();
  updateScrollLock();
}

// Re-render whatever the card modal is currently showing against the freshly
// resolved CARDS (after a deck or language change), keeping orientation/position.
function refreshOpenModal() {
  if (!document.getElementById('card-modal').classList.contains('open')) return;

  const remap = (c) => {
    const base = CARDS.find(cc => cc.id === c.id);
    return base ? { ...base, isReversed: c.isReversed, displayName: getCardName(base) } : c;
  };

  if (modalCards) {
    modalCards = modalCards.map(remap);
    if (pagerActive()) {
      modalIndex = deckK;            // preserve the swiped-to position
      buildDeck();
    } else {
      fillModalCard(modalCards[Math.max(0, modalIndex)], modalOpts || {});
    }
  } else if (modalCard) {
    modalCard = remap(modalCard);
    fillModalCard(modalCard, modalOpts || {});
  }
}

function closeSettingsDrawer() {
  document.getElementById('visual-settings-col').classList.remove('open');
  updateScrollLock();
}

function teardownOverlays() {
  closeCardModal();
  closeSettingsDrawer();
}

function closeModal(event) {
  if (!event || event.target.id === 'card-modal') {
    if (history.state && history.state.overlay === 'card') history.back();
    else teardownOverlays();
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal({ target: { id: 'card-modal' }});
    closeLangPicker();
    toggleMenu(false);
  }
});

// ===== MOBILE HOME: FAN OF SPREADS, HAND SETUP, MENU =====
// Six spreads fan out from the bottom corner on the user's writing-hand side;
// drag one out to deal it. Only runs on the mobile layout (≤768px) — on desktop
// the plain spread list is shown and none of this is built.
const MOBILE_MQ = matchMedia('(max-width: 768px)');

// s = card slots in "card units" (centre x, centre y[, rotation]) inside a bw × bh box.
const FAN_SPREADS = [
  // Not a spread: dragging it out shuffles the deck.
  { key: 'shuffle',      num: '0',       bw: 1.5, bh: 1.7, shuffle: true, idx: true, s: [[.5, .85, -7], [.75, .8], [1.0, .85, 7]] },
  { key: 'single',       num: 'I',       bw: 1,   bh: 1.6, s: [[.5, .8]] },
  { key: 'three',        num: 'III',     bw: 3.6, bh: 1.6, s: [[.5, .8], [1.8, .8], [3.1, .8]] },
  { key: 'celtic',       num: 'X',       bw: 5.1, bh: 6.8, s: [[1.8, 3.4], [1.8, 3.4, 90], [1.8, 5.6], [.5, 3.4], [1.8, 1.2], [3.1, 3.4], [4.6, 6.0], [4.6, 4.27], [4.6, 2.53], [4.6, .8]] },
  { key: 'horseshoe',    num: 'VII',     bw: 7.6, bh: 4.2, s: [.8, 2.0, 3.0, 3.4, 3.0, 2.0, .8].map((y, i) => [.5 + i * 1.1, y]) },
  { key: 'relationship', num: 'VI',      bw: 3.6, bh: 3.5, s: [[.5, .8], [3.1, .8], [1.8, .8], [.5, 2.7], [1.8, 2.7], [3.1, 2.7]] },
  { key: 'index',        num: 'LXXVIII', bw: 7.0, bh: 7.0, idx: true, s: Array.from({ length: 24 }, (_, i) => [.5 + (i % 6) * 1.2, .8 + Math.floor(i / 6) * 1.8]) },
];
const FAN_GEO = { r0: 104, cw: 138, ch: 222, lift: 34, a0: -72, a1: -18, th: 115 };
const FAN_BOARD_H = 420;

const fan = {
  built: false,
  hand: 'right',      // saved preference
  side: 'right',      // side the fan is currently laid out on
  sel: FAN_SPREADS.findIndex(sp => sp.key === 'three'),
  busy: false,        // a shuffle is playing
  drag: null,         // { i, dx, dy, dropped? }
  st: null,           // pointer gesture in progress
  phase: 'idle',      // idle | deal | fly | ready
  shown: false,       // false = cards tucked off-screen in the corner
  dealIdx: 0,
  k: 1,
  arms: [], cards: [], timers: [],
};

// Lay a spread's slots out in the box (bx, by, bw, bh). top = pin to the top edge.
function layoutSlots(sp, bx, by, bw, bh, top) {
  const k = Math.min(bw / sp.bw, bh / sp.bh);
  const ox = bx + (bw - sp.bw * k) / 2;
  const oy = top ? by : by + (bh - sp.bh * k) / 2;
  return sp.s.map((p, i) => ({
    n: sp.idx ? '' : i + 1,
    l: ox + (p[0] - .5) * k, t: oy + (p[1] - .8) * k,
    w: k, h: 1.6 * k, r: p[2] || 0,
    fs: Math.max(9, Math.round(k * .42)),
  }));
}

const fanM = () => fan.side === 'left' ? -1 : 1;
const fanAngle = i => (FAN_GEO.a0 + (FAN_GEO.a1 - FAN_GEO.a0) * i / (FAN_SPREADS.length - 1)) * fanM();
const fanProg = () => fan.drag && !fan.drag.dropped ? Math.min(Math.hypot(fan.drag.dx, fan.drag.dy) / FAN_GEO.th, 1) : 0;
const fanAt = (ms, fn) => fan.timers.push(setTimeout(fn, ms));
const fanClear = () => { fan.timers.forEach(clearTimeout); fan.timers = []; };
const handPending = () => document.documentElement.classList.contains('needs-hand');

function fanInit() {
  if (fan.built || !MOBILE_MQ.matches) return;
  fan.built = true;
  try {
    const saved = localStorage.getItem(LS_HAND);
    if (saved === 'left' || saved === 'right') fan.hand = saved;
  } catch (e) {}
  fan.side = fan.hand;

  const root = document.getElementById('fan');
  root.classList.toggle('left', fan.side === 'left');
  FAN_SPREADS.forEach((s, i) => {
    const arm = document.createElement('div');
    arm.className = 'fan-arm';
    const card = document.createElement('div');
    card.className = 'fan-card';
    card.innerHTML = '<div class="fan-rule"></div><span class="fan-num"></span><div class="fan-mini"></div><span class="fan-title"></span>';
    card.addEventListener('pointerdown', e => fanDown(e, i));
    card.addEventListener('pointermove', fanMove);
    card.addEventListener('pointerup', fanUp);
    card.addEventListener('pointercancel', fanUp);
    arm.appendChild(card);
    root.appendChild(arm);
    fan.arms.push(arm);
    fan.cards.push(card);
  });
  deckBuild();
  window.addEventListener('resize', fanResize);
  fanResize();
  fanMinis();
  fanText();
  updateMenuHand();
}

// The fan is drawn at a fixed design size and scaled down on short screens.
function fanResize() {
  fan.k = Math.max(.72, Math.min(1, window.innerHeight / 844));
  document.getElementById('fan').style.setProperty('--fk', fan.k);
  fanPreview();
  deckPlace(false, fan.phase === 'ready');
}

function fanMinis() {
  const g = FAN_GEO, left = fanM() === 1 ? 12 + 14 + 12 : 12;
  FAN_SPREADS.forEach((s, i) => {
    fan.cards[i].querySelector('.fan-mini').innerHTML = layoutSlots(s, left, 38, g.cw - 12 - 14 - 24, g.ch * .45)
      .map(p => `<i style="left:${p.l}px;top:${p.t}px;width:${p.w}px;height:${p.h}px;transform:rotate(${p.r}deg)"></i>`).join('');
  });
}

// Everything language-dependent on the home screen.
function fanText() {
  if (!fan.built) return;
  FAN_SPREADS.forEach((s, i) => {
    fan.cards[i].querySelector('.fan-num').textContent = s.num;
    fan.cards[i].querySelector('.fan-title').textContent = t(`spread.${s.key}.title`);
  });
  document.getElementById('deal-read').textContent =
    t(FAN_SPREADS[fan.dealIdx].idx ? 'home.openIndex' : 'home.readHand');
  fanPreview();
  fanHint();
  fanMessage();
}

function fanPreview() {
  if (!fan.built) return;
  const s = FAN_SPREADS[fan.sel];
  document.getElementById('fan-name').textContent = t(`spread.${s.key}.title`);
  document.getElementById('fan-desc').textContent = t(`spread.${s.key}.desc`);
  const box = document.getElementById('fan-diagram');
  box.innerHTML = layoutSlots(s, 0, 0, box.clientWidth || 342, 150, true).map(p =>
    `<div class="slot" style="left:${p.l}px;top:${p.t}px;width:${p.w}px;height:${p.h}px;font-size:${p.fs / 18}rem;transform:rotate(${p.r}deg)">${p.n}</div>`
  ).join('');
}

function fanHint() {
  const p = fanProg();
  document.getElementById('fan-hint').textContent =
    t(p >= 1 ? (FAN_SPREADS[fan.sel].shuffle ? 'home.hint.shuffle' : 'home.hint.release') : p > 0 ? 'home.hint.further' : 'home.hint.drag');
  document.getElementById('fan-ring').style.opacity = p >= 1 ? 1 : p * .45;
}

function fanMessage() {
  const msgs = t('dealing.messages');
  const mi = { deal: 0, fly: 2, ready: 3 }[fan.phase] ?? 0;
  document.getElementById('deal-msg').textContent = Array.isArray(msgs) ? msgs[mi] || '' : '';
}

// Position every card from the current state (selection, drag, phase).
function fanLayout() {
  if (!fan.built) return;
  const g = FAN_GEO, m = fanM(), n = FAN_SPREADS.length;
  const idle = fan.phase === 'idle';
  FAN_SPREADS.forEach((s, i) => {
    const d = fan.drag && fan.drag.i === i ? fan.drag : null;
    const isSel = fan.sel === i && idle;
    const t = d && !d.dropped ? Math.min(Math.hypot(d.dx, d.dy) / g.th, 1) : (d ? 1 : 0);
    // Neighbours of the selected card part to make room for it.
    const a = fanAngle(i) + (idle ? (i < fan.sel ? -3 : i > fan.sel ? 4 : 0) : 0) * m;
    const out = (!idle || !fan.shown) && !d;
    const dx = d ? d.dx : out ? 230 * m : 0;
    const dy = d ? d.dy : out ? 230 : 0;
    const arm = fan.arms[i], card = fan.cards[i];
    arm.style.transform = `translate(${dx}px,${dy}px) rotate(${a * (1 - .5 * t)}deg)`;
    arm.style.transition = d && !d.dropped ? 'none'
      : `transform .5s cubic-bezier(.2,.8,.2,1) ${out ? (n - i) * 30 : i * 40}ms, opacity .35s`;
    arm.style.zIndex = d ? 60 : i + 10;
    arm.style.opacity = d && d.dropped ? 0 : 1;
    card.style.transform = `translateY(-${isSel || d ? g.lift : 0}px) scale(${d ? 1 + .06 * t : 1})`;
    card.style.boxShadow = isSel || d ? '-4px 12px 30px rgba(0,0,0,.8)' : '-3px 5px 14px rgba(0,0,0,.6)';
  });
}

function fanDown(e, i) {
  if (fan.phase !== 'idle' || !fan.shown || fan.busy || fan.st) return;
  if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
  fan.st = { i, x: e.clientX, y: e.clientY, id: e.pointerId };
  fan.sel = i;
  fan.drag = { i, dx: 0, dy: 0 };
  fanPreview();
  fanLayout();
  fanHint();
}

function fanMove(e) {
  const s = fan.st;
  if (!s || e.pointerId !== s.id) return;
  fan.drag = { i: s.i, dx: (e.clientX - s.x) / fan.k, dy: (e.clientY - s.y) / fan.k };
  fanLayout();
  fanHint();
}

function fanUp(e) {
  const s = fan.st;
  if (!s || e.pointerId !== s.id) return;
  fan.st = null;
  const d = fan.drag;
  if (d && Math.hypot(d.dx, d.dy) > FAN_GEO.th) {
    if (FAN_SPREADS[d.i].shuffle) {
      fan.drag = null;              // the card springs back; the deck does the work
      fanLayout();
      fanHint();
      deckShuffle();
    } else {
      fanDeal(d.i, d);
    }
  } else {
    fan.drag = null;
    fanLayout();
    fanHint();
  }
}

// Deal spread i: backs fly from `src` (viewport px) to the spread's slots.
function fanDeal(i, drag) {
  fanClear();
  fan.phase = 'deal';
  fan.dealIdx = i;
  fan.sel = i;
  fan.drag = { ...(drag || { i, dx: 0, dy: 0 }), dropped: true };
  const sp = FAN_SPREADS[i];
  // The dealt screen is a history step of its own, so back (arrow, swipe or
  // hardware) returns to the fan instead of leaving the app.
  if (!(history.state && history.state.panel === 'deal')) history.pushState({ panel: 'deal' }, '', location.pathname);
  document.getElementById('fan-home').classList.add('dealing');
  document.getElementById('deal-read').textContent = t(sp.idx ? 'home.openIndex' : 'home.readHand');

  // Cards are drawn from the deck: each back starts on top of it.
  const deckBox = document.querySelector('#deck .deck-layer.top').getBoundingClientRect();
  const src = { x: deckBox.left + deckBox.width / 2, y: deckBox.top + deckBox.height / 2 };
  const board = document.getElementById('deal-board');
  const br = board.getBoundingClientRect();
  const slots = layoutSlots(sp, 0, 0, board.clientWidth, FAN_BOARD_H);
  const gap = Math.min(90, 1400 / slots.length);
  board.replaceChildren(...slots.map((p, j) => {
    const el = document.createElement('div');
    el.className = 'deal-back';
    el.style.cssText = `width:${p.w}px;height:${p.h}px;z-index:${70 + j + (p.r ? 20 : 0)};`
      + `transform:translate(${src.x - br.left - p.w / 2}px,${src.y - br.top - p.h / 2}px) rotate(${deckAngle()}deg) scale(${deckBox.width / p.w})`;
    return el;
  }));
  fanLayout();
  fanMessage();

  fanAt(60, () => {
    fan.phase = 'fly';
    Array.from(board.children).forEach((el, j) => {
      const p = slots[j];
      el.style.transition = `transform .7s cubic-bezier(.2,.8,.2,1) ${j * gap}ms`;
      el.style.transform = `translate(${p.l}px,${p.t}px) rotate(${p.r}deg)`;
    });
    fanMessage();
  });
  fanAt(60 + slots.length * gap + 800, () => {
    fan.phase = 'ready';
    document.getElementById('deal-cta').classList.add('show');
    deckPlace(true, true);        // every card is down: the deck slides off its screen edge
    fanMessage();
  });
}

// "Read the hand": hand the dealt spread over to the reading screen.
function fanRead() {
  const key = FAN_SPREADS[fan.dealIdx].key;
  state.spread = key;
  selectChoiceButton('spread', key);
  if (history.state && history.state.panel === 'deal') history.replaceState({ panel: 'setup' }, '', location.pathname);
  beginReading(false, true);
}

// "Choose another spread": step back out of the dealt screen.
function fanCancel() {
  if (history.state && history.state.panel === 'deal') history.back();   // popstate -> fanReset
  else fanReset();
}

// Back to the idle fan (also the re-entry to home).
function fanReset() {
  fanClear();
  fan.phase = 'idle';
  fan.drag = null;
  fan.st = null;
  document.getElementById('fan-home').classList.remove('dealing');
  document.getElementById('deal-cta').classList.remove('show');
  deckPlace(true);                 // the deck slides back in
  document.getElementById('deal-board').replaceChildren();
  fanLayout();
  fanHint();
  fanMessage();
}

// Home screen (re)appears: reset, then deal the fan in from the corner.
function fanEnter() {
  if (!fan.built) { fanInit(); if (!fan.built) return; }
  fanReset();
  fan.shown = false;
  fanLayout();
  fanPreview();
  if (handPending()) return;            // first launch: wait for the hand question
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (fan.phase !== 'idle' || handPending()) return;
    fan.shown = true;
    fanLayout();
  }));
}

// Move the fan to the other corner: tuck it away, switch sides, deal it back.
function setHand(h, persist) {
  fan.hand = h;
  if (persist) { try { localStorage.setItem(LS_HAND, h); } catch (e) {} }
  updateMenuHand();
  if (!fan.built || fan.side === h) return;
  const apply = () => {
    fan.side = h;
    document.getElementById('fan').classList.toggle('left', h === 'left');
    fanMinis();
    fanLayout();
    deckPlace(true, fan.phase === 'ready');
  };
  if (!fan.shown || fan.phase !== 'idle') { apply(); return; }
  fan.shown = false;
  fanLayout();
  fanAt(450, () => { apply(); fan.shown = true; fanLayout(); });
}

function updateMenuHand() {
  document.querySelectorAll('.seg[data-hand]').forEach(b => {
    b.classList.toggle('on', b.dataset.hand === fan.hand);
  });
}

// First-launch question. The pick is saved on the device and never asked again.
function dismissHandSetup() {
  document.documentElement.classList.remove('needs-hand');
}

function chooseHand(h) {
  setHand(h, true);
  dismissHandSetup();
  deckPlace(true);              // the deck slides to the side opposite the fan
  fan.shown = true;
  fanLayout();
}

// "Liahim": let the hand choose a spread (never the Card Index or Shuffle) and
// deal it now, straight off the deck. No side was picked, so nothing is saved:
// the question comes back next launch. This session the fan uses the default.
function chooseLiahim() {
  setHand('right', false);
  const dealable = FAN_SPREADS.map((sp, i) => i).filter(i => !FAN_SPREADS[i].idx);
  fan.shown = false;
  fanDeal(dealable[Math.floor(Math.random() * dealable.length)]);   // reads the deck where it sits now
  dismissHandSetup();
  deckPlace(true);              // to its corner while the cards are dealt; it leaves once they're down
}

// ----- The deck -----
const DECK_LAYERS = 8;
const DECK_HOME_SCALE = 0.8;

let deckOrder = [];          // layers, bottom -> top

function deckBuild() {
  const deck = document.getElementById('deck');
  deckOrder = Array.from({ length: DECK_LAYERS }, () => {
    const el = document.createElement('i');
    el.className = 'deck-layer';
    return el;
  });
  deck.replaceChildren(...deckOrder);
  deckLayout();
  deck.addEventListener('click', deckShuffle);
}

// Stack the layers in deckOrder (last = top, shows the back art). Order is
// kept in z-index rather than the DOM, so a re-stack animates instead of
// snapping. Deterministic little offsets so the pile looks hand-piled.
function deckLayout() {
  deckOrder.forEach((el, i) => {
    const j = (i * 37) % 7 - 3;
    el.classList.toggle('top', i === DECK_LAYERS - 1);
    el.style.cssText = `--i:${i};--x:${(i - DECK_LAYERS) * 0.9 + j * 0.25}px;--y:${(i - DECK_LAYERS) * 1.3}px;--r:${j * 0.5}deg;z-index:${i}`;
  });
}

// Rotation of the deck as placed (used to start dealt cards at the same tilt).
function deckAngle() {
  if (handPending()) return -3;
  return fan.side === 'right' ? -4 : 4;
}

// Centre of the screen on the hand question; otherwise on the side opposite the
// fan (left for a right-handed user, and vice versa). away = slid off that edge.
function deckPlace(animate, away) {
  const deck = document.getElementById('deck');
  let x, y, sc;
  if (handPending()) {
    const r = document.getElementById('hs-slot').getBoundingClientRect();
    x = r.left; y = r.top; sc = r.width / 150;
  } else {
    sc = DECK_HOME_SCALE * fan.k;
    const w = 150 * sc, h = 240 * sc;
    const toLeft = fan.side === 'right';
    x = away ? (toLeft ? -w - 60 : window.innerWidth + 60)
             : (toLeft ? 10 : window.innerWidth - w - 10);
    y = window.innerHeight - h - 250;   // well above the fan
  }
  if (!animate) deck.style.transition = 'none';
  deck.style.transform = `translate(${x}px,${y}px) rotate(${deckAngle()}deg) scale(${sc})`;
  if (!animate) { void deck.offsetWidth; deck.style.transition = ''; }
  else {
    // Stay above the fading hand question while crossing the screen.
    deck.classList.add('moving');
    setTimeout(() => deck.classList.remove('moving'), 750);
  }
}

// Three riffles: split the pile to both sides, then merge the halves at random.
async function deckShuffle() {
  if (fan.busy || (fan.phase !== 'idle' && !handPending())) return;
  fan.busy = true;
  const deck = document.getElementById('deck');
  const wait = ms => new Promise(r => setTimeout(r, ms));
  deck.classList.add('shuffling');
  for (let round = 0; round < 3; round++) {
    const half = deckOrder.length / 2;
    deckOrder.forEach((el, i) => el.classList.add(i < half ? 'sl' : 'sr'));
    await wait(260);
    const lo = deckOrder.slice(0, half), hi = deckOrder.slice(half);
    // Riffle: drop cards from either half at random until both are used up.
    const merged = [], oldTop = deckOrder[deckOrder.length - 1];
    while (lo.length || hi.length) {
      const pile = !hi.length || (lo.length && Math.random() < 0.5) ? lo : hi;
      merged.push(pile.shift());
    }
    if (merged[merged.length - 1] === oldTop) merged.push(merged.splice(merged.length - 2, 1)[0]);   // the top card always changes
    deckOrder = merged;
    deckOrder.forEach(el => el.classList.remove('sl', 'sr'));
    deckLayout();
    await wait(300);
  }
  deck.classList.remove('shuffling');
  fan.busy = false;
}

// ----- Hamburger menu -----
function toggleMenu(force) {
  const panel = document.getElementById('menu-panel');
  const open = force != null ? force : !panel.classList.contains('open');
  panel.classList.toggle('open', open);
  document.getElementById('menu-scrim').classList.toggle('open', open);
  const btn = document.getElementById('menu-btn');
  btn.classList.toggle('open', open);
  btn.setAttribute('aria-expanded', open);
}

function menuGo(where) {
  toggleMenu(false);
  if (where === 'journal') openJournal();
  else if (!document.getElementById('visual-settings-col').classList.contains('open')) toggleSettingsPanel();
}

MOBILE_MQ.addEventListener('change', () => { if (MOBILE_MQ.matches) fanEnter(); });

// ===== INIT =====
// initialLang() is declared in the early <script> in <head>.

function initFromURL() {
  const originalSearch = location.search;
  const decoded = decodeReadingFromURL();
  history.replaceState({ panel: 'setup' }, '', location.pathname);
  if (decoded) {
    applyDecodedReading(decoded);
    history.pushState({ panel: 'reading' }, '', originalSearch);
  }
}

// Load the JSON data files, resolve for the active language, then run the
// original URL-driven init. Needs http(s) — fetch() is blocked on file://.
async function boot() {
  placeSettingsPanel();

  const load = (p) => fetch(p).then(r => {
    if (!r.ok) throw new Error(`${p}: ${r.status}`);
    return r.json();
  });
  try {
    const [cards, rws, visconti, en, ru, es] = await Promise.all([
      load('data/general/cards.json'),
      load('data/decks/rider-waite-smith.json'),
      load('data/decks/visconti-sforza.json'),
      load('data/locales/en.json'),
      load('data/locales/ru.json'),
      load('data/locales/es.json'),
    ]);
    RAW.cards = cards;
    RAW.decks = { 'rider-waite-smith': rws, 'visconti-sforza': visconti };
    RAW.locales = { en, ru, es };
  } catch (err) {
    console.error('boot: data load failed', err);
    document.getElementById('app').innerHTML =
      '<p style="padding:2rem 1rem;text-align:center;color:var(--parch);line-height:1.6">' +
      'Could not load card data. Serve this page over http(s) — e.g. <code>npm run serve</code> — ' +
      'rather than opening the file directly.</p>';
    document.body.classList.add('i18n-ready');   // reveal the header even on failure
    return;
  }

  LANG = initialLang();
  document.documentElement.lang = LANG;

  try {
    const savedDeck = localStorage.getItem(LS_DECK);
    if (savedDeck && DECK_CHOICES.includes(savedDeck)) state.deck = savedDeck;
  } catch (e) {}

  updateLangPicker();
  selectChoiceButton('deck', state.deck);
  selectChoiceButton('spread', state.spread);

  resolveDeck(state.deck);
  resolveCards();
  resolveSpreads();
  applyI18n();
  document.body.classList.add('i18n-ready');   // header text is correct now — fade it in

  initFromURL();
  fanEnter();
}

boot();

// THE reconciler: every back/forward (on-screen arrow, browser, or Android
// gesture) lands here, and this is the only place that maps history.state back
// onto the DOM. Screens are stacked as pushState entries:
//   {panel:'setup'}  ->  {panel:'reading'}  ->  {overlay:'card'}  ->  {overlay:'settings'}
window.addEventListener('popstate', (e) => {
  const st = e.state;
  const modalOpen = document.getElementById('card-modal').classList.contains('open');
  const drawerOpen = document.getElementById('visual-settings-col').classList.contains('open');

  if (modalOpen || drawerOpen) {
    // Peel one layer: close whichever overlay the entry we've landed on is NOT.
    // (e.g. drawer opened over the card modal -> back closes only the drawer.)
    if (drawerOpen && !(st && st.overlay === 'settings')) closeSettingsDrawer();
    if (modalOpen && !(st && st.overlay === 'card')) closeCardModal();
    return;                     // consumed the back gesture -- don't switch panels / minimize
  }

  if (st && st.panel === 'journal') {
    renderJournal();
    showPanel('journal-panel');
    return;
  }

  if (st && st.panel === 'reading') {
    const decoded = decodeReadingFromURL();
    if (decoded) {
      applyDecodedReading(decoded);
      return;
    }
  }
  showPanel('setup-panel');
});

// ===== ANDROID HARDWARE / GESTURE BACK (Capacitor shell) =====
// Android WebView's native canGoBack() ignores history.pushState entries, so
// Capacitor's default handling minimizes the app instead of closing an overlay
// or stepping back a panel. Take over the decision and drive our own history.
if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
  const App = window.Capacitor.Plugins.App;
  App.addListener('backButton', () => {
    const overlayOpen =
      document.getElementById('card-modal').classList.contains('open') ||
      document.getElementById('visual-settings-col').classList.contains('open');
    if (overlayOpen || (history.state && (history.state.panel === 'reading' || history.state.panel === 'journal' || history.state.panel === 'deal'))) {
      history.back();
    } else {
      App.minimizeApp();
    }
  });
}
</script>
